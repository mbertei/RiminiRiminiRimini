name: Daily Train Delay Tracker

on:
  schedule:
    - cron: '15 9,21 * * *'  # Esegue tutti i giorni alle 09:15 e 21:15
  workflow_dispatch:        # Permette l'avvio manuale dalla tab Actions

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run train fetcher script
        run: python fetch_trains.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || (git commit -m "Update train data [skip ci]" && git push)
